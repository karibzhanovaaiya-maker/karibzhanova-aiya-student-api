spring.application.name=karibzhanova-aiya-student-api
server.port=8080

# Student who owns this project
app.student.name=Karibzhanova Aiya
app.version=@version@

# PostgreSQL connection. Real values come from environment variables
# (docker-compose.yml reads them from .env). The defaults are for local runs only.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:student}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
