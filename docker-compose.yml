# Student API by Karibzhanova Aiya: Spring Boot app + PostgreSQL
# Start:  docker compose up -d --build
# Values like ${DB_NAME} come from the .env file (not committed to Git).

name: karibzhanova-aiya-student-api

services:
  db:
    image: postgres:16
    container_name: karibzhanova-aiya-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - karibzhanova-aiya-pgdata:/var/lib/postgresql/data
    networks:
      - karibzhanova-aiya-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: karibzhanova-aiya-student-api:${APP_TAG:-v1.0-karibzhanova-aiya}
    container_name: karibzhanova-aiya-app
    restart: unless-stopped
    environment:
      # "db" is the service name above. Inside the Docker network it works like a hostname.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - karibzhanova-aiya-network

volumes:
  karibzhanova-aiya-pgdata:

networks:
  karibzhanova-aiya-network:
